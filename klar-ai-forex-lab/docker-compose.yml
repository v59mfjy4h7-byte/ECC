# Startar hela labbet: http://localhost:8080
services:
  backend:
    build: ./backend
    environment:
      KLAR_DATA_DIR: /data
      # Läses från .env bredvid denna fil om den finns (behövs bara för signerad riskkonfiguration)
      KLAR_RISK_SIGNING_KEY: ${KLAR_RISK_SIGNING_KEY:-}
      GIT_SHA: ${GIT_SHA:-}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
